[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lead-bot"
version = "2.0.0"
description = "Telegram-бот для бизнеса: ответы на частые вопросы, приём заявок и работа с ними прямо в Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ivan" }]
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.10", "jinja2>=3.1"]

[project.scripts]
lead-bot = "lead_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_bot"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
# в демо-скрипте длинные строки CSS
"scripts/*" = ["E501"]
