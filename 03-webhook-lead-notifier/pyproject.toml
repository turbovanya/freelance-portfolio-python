[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lead-hub"
version = "2.0.0"
description = "Приём заявок с сайта: проверка, сохранение, уведомление в Telegram и панель для менеджера"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ivan" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
lead-hub = "lead_hub.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_hub"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
