<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демо-форма · Lead Hub</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         font:15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#1b2232;
         background:linear-gradient(135deg, #e9eefc 0%, #f7f3ff 100%); }
  .box { width:100%; max-width:420px; background:#fff; border-radius:16px; padding:32px; box-shadow:0 12px 40px rgba(30,40,90,.12); }
  h1 { font-size:24px; margin:0 0 6px; }
  p.lead { color:#6c7489; margin:0 0 22px; }
  label { display:block; font-size:13px; color:#6c7489; margin:14px 0 6px; }
  input, textarea { width:100%; padding:11px 13px; border:1px solid #dfe3ec; border-radius:10px; font:inherit; }
  input:focus, textarea:focus { outline:2px solid #c7d2fe; border-color:#3b5bdb; }
  textarea { resize:vertical; min-height:80px; }
  button { margin-top:20px; width:100%; padding:13px; border:0; border-radius:10px; background:#3b5bdb; color:#fff; font:600 15px/1 inherit; cursor:pointer; }
  .hp { position:absolute; left:-9999px; }
  .result { margin-top:16px; padding:12px 14px; border-radius:10px; display:none; }
  .result.ok { display:block; background:#e6f4ea; color:#2b8a3e; }
  .result.err { display:block; background:#fdecec; color:#c92a2a; }
  .note { margin-top:18px; font-size:12px; color:#9aa1b2; text-align:center; }
</style>
</head>
<body>
<form class="box" id="form">
  <h1>Обсудим ваш проект</h1>
  <p class="lead">Оставьте контакты, перезвоним в течение 15 минут в рабочее время.</p>

  <label for="name">Имя</label>
  <input id="name" name="name" required minlength="2" placeholder="Иван">

  <label for="phone">Телефон</label>
  <input id="phone" name="phone" required placeholder="+7 900 000-00-00" inputmode="tel">

  <label for="email">Email (необязательно)</label>
  <input id="email" name="email" type="email" placeholder="ivan@example.com">

  <label for="message">Что нужно сделать?</label>
  <textarea id="message" name="message" placeholder="Коротко опишите задачу"></textarea>

  <!-- ловушка для ботов: человек это поле не видит -->
  <input class="hp" name="website" tabindex="-1" autocomplete="off">

  <button type="submit">Отправить заявку</button>
  <div class="result" id="result"></div>
  <div class="note">Демонстрационная форма Lead Hub</div>
</form>
<script>
  const params = new URLSearchParams(location.search);
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    for (const k of ["utm_source", "utm_medium", "utm_campaign"]) if (params.get(k)) data[k] = params.get(k);
    data.source = "demo-form";
    const box = document.getElementById("result");
    try {
      const resp = await fetch("/api/v1/leads?key=" + encodeURIComponent(params.get("key") || ""), {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data),
      });
      const body = await resp.json();
      if (resp.ok) { box.className = "result ok"; box.textContent = "Спасибо! Заявка отправлена, скоро свяжемся."; e.target.reset(); }
      else { box.className = "result err"; box.textContent = (body.errors || []).map((x) => x.message).join("; ") || body.detail || resp.status; }
    } catch (err) { box.className = "result err"; box.textContent = "Нет связи с сервером"; }
  });
</script>
</body>
</html>
