[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "price-parser"
version = "1.2.0"
description = "Мониторинг цен в каталогах: выгрузка в Excel, CSV и HTML-отчёт, история цен, уведомления в Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ivan" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
price-parser = "price_parser.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/price_parser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
